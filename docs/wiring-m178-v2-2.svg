<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="1200" height="1020" fill="#fff"/><rect x="20" y="15" width="1160" height="48" fill="#15334a" stroke="#ffffff"/><text x="600" y="47.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">02 / Pro Micro → дисплей и I2C</text><rect x="25" y="70" width="1150" height="45" fill="#f1f5f9" stroke="#cbd5e1"/><text x="600" y="97.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Pro Micro 5 V / 16 MHz • GC9A01 240×240 • CHMCU-2317 (MCP23017).</text><rect x="30" y="140" width="300" height="45" fill="#dbeafe" stroke="#334155"/><text x="180" y="167.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Pro Micro</text><rect x="790" y="140" width="360" height="45" fill="#e0e7ff" stroke="#334155"/><text x="970" y="167.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GC9A01 • SPI</text><rect x="30" y="205" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="180" y="230.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D15 / SCK</text><rect x="790" y="205" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="230.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">SCL / SCK</text><path d="M330 225 L790 225" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="30" y="265" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="180" y="290.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D16 / MOSI</text><rect x="790" y="265" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="290.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">SDA / MOSI</text><path d="M330 285 L790 285" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="30" y="325" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="180" y="350.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D7</text><rect x="790" y="325" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="350.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">DC</text><path d="M330 345 L790 345" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="30" y="385" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="180" y="410.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D8</text><rect x="790" y="385" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="410.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">RES</text><path d="M330 405 L790 405" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="30" y="445" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="180" y="470.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D10</text><rect x="790" y="445" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="470.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">CS</text><path d="M330 465 L790 465" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="30" y="505" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="180" y="530.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D9</text><rect x="790" y="505" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="530.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">BLK</text><path d="M330 525 L790 525" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="30" y="610" width="300" height="45" fill="#ffffff" stroke="#334155"/><text x="180" y="637.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D2 / SDA</text><rect x="790" y="610" width="360" height="45" fill="#ffffff" stroke="#334155"/><text x="970" y="637.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">CHMCU-2317 / SDA</text><path d="M330 632 L790 632" stroke="#0891b2" stroke-width="2"  fill="none"/><rect x="30" y="680" width="300" height="45" fill="#ffffff" stroke="#334155"/><text x="180" y="707.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D3 / SCL</text><rect x="790" y="680" width="360" height="45" fill="#ffffff" stroke="#334155"/><text x="970" y="707.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">CHMCU-2317 / SCL</text><path d="M330 702 L790 702" stroke="#0891b2" stroke-width="2"  fill="none"/><rect x="30" y="755" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="782.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">CHMCU-2317: адресные A0/A1/A2 → GND, адрес 0x20. Это НЕ GPIO A0/A1/A2.</text><text x="590" y="801.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">RESET → подтяжка к +5 V. INT A / INT B в этой схеме не используются.</text><rect x="30" y="840" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="867.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">I2C только для CHMCU-2317: SDA→D2, SCL→D3, VCC→5V, GND→GND.</text><text x="590" y="886.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">GPIO A0=N, A2..A7=передачи 1..6. +12 V на модуль нельзя.</text><rect x="30" y="925" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="952.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">GC9A01: питание от +5 V и сигналы 5 V допустимы только для совместимого модуля.</text><text x="590" y="971.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Если модуль рассчитан на 3,3 V — нужны соответствующее питание и согласование логики / BLK.</text></svg>