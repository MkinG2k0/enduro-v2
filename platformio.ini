; Enduro — Pro Micro (ATmega32U4) + GC9A01; gears on native GPIO (no MCP)
; Typical clone "Pro Micro" 5V/16MHz (often marked like v1.0 / similar).
; If yours is 3.3V/8MHz: use env:promicro8
;
; Mode: USB without bike harness → DEMO; gear/N present → production signals.

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
; upload_port auto-detect (Pro Micro jumps COM after 1200bps reset)
lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.11
  adafruit/Adafruit GC9A01A @ ^1.1.0
  adafruit/Adafruit BusIO @ ^1.16.1

build_flags =
  -DENDURO_FW_VERSION=\"2.3.0\"
  -mcall-prologues
  -Os
  -flto
  -ffunction-sections
  -fdata-sections
  -fno-exceptions
  -fno-threadsafe-statics
  -Wl,--gc-sections
  -Wl,--relax

build_src_filter =
  +<*>
  -<mcp_inputs.cpp>

[env:promicro]
board = sparkfun_promicro16
upload_speed = 57600

[env:promicro8]
board = sparkfun_promicro8
upload_speed = 57600
