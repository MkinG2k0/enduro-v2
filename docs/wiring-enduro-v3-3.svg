<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="1200" height="1020" fill="#fff"/><rect x="20" y="15" width="1160" height="48" fill="#15334a" stroke="#ffffff"/><text x="600" y="47.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">03 / PC817 (+12 V) и дисплей GC9A01</text><rect x="25" y="70" width="1150" height="45" fill="#f1f5f9" stroke="#cbd5e1"/><text x="600" y="97.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Оптрон для RPM / SPEED / дальнего. Экран — левый край платы.</text><rect x="40" y="130" width="250" height="40" fill="#dbeafe" stroke="#334155"/><text x="165" y="155.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">M178 / борт</text><rect x="420" y="130" width="220" height="40" fill="#fef3c7" stroke="#334155"/><text x="530" y="155.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817</text><rect x="860" y="130" width="280" height="40" fill="#dcfce7" stroke="#334155"/><text x="1000" y="155.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Pro Micro</text><rect x="40" y="190" width="250" height="50" fill="#ffffff" stroke="#334155"/><text x="165" y="220.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">16 / RPM</text><rect x="420" y="190" width="220" height="50" fill="#fef3c7" stroke="#334155"/><text x="530" y="220.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">CH1 IN → OUT</text><rect x="860" y="190" width="280" height="50" fill="#ffffff" stroke="#334155"/><text x="1000" y="220.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D0 INPUT_PULLUP</text><path d="M290 215 L420 215" stroke="#9333ea" stroke-width="2"  fill="none"/><path d="M640 215 L860 215" stroke="#9333ea" stroke-width="2"  fill="none"/><rect x="40" y="260" width="250" height="50" fill="#ffffff" stroke="#334155"/><text x="165" y="290.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">9 / SPEED?</text><rect x="420" y="260" width="220" height="50" fill="#fef3c7" stroke="#334155"/><text x="530" y="290.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">CH2 IN → OUT</text><rect x="860" y="260" width="280" height="50" fill="#ffffff" stroke="#334155"/><text x="1000" y="290.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D1 INPUT_PULLUP</text><path d="M290 285 L420 285" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" fill="none"/><path d="M640 285 L860 285" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" fill="none"/><rect x="40" y="330" width="250" height="50" fill="#ffffff" stroke="#334155"/><text x="165" y="360.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">4 / Дальний +12 V</text><rect x="420" y="330" width="220" height="50" fill="#fef3c7" stroke="#334155"/><text x="530" y="360.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">CH3 IN → OUT</text><rect x="860" y="330" width="280" height="50" fill="#ffffff" stroke="#334155"/><text x="1000" y="360.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D9 INPUT_PULLUP</text><path d="M290 355 L420 355" stroke="#2563eb" stroke-width="2"  fill="none"/><path d="M640 355 L860 355" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="40" y="420" width="250" height="50" fill="#e2e8f0" stroke="#334155"/><text x="165" y="450.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">1 / GND борт</text><rect x="420" y="420" width="220" height="50" fill="#e2e8f0" stroke="#334155"/><text x="530" y="450.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GND_in модуля</text><path d="M290 445 L420 445" stroke="#334155" stroke-width="2"  fill="none"/><rect x="860" y="420" width="280" height="50" fill="#e2e8f0" stroke="#334155"/><text x="1000" y="450.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GND_out → GND Arduino</text><path d="M640 445 L860 445" stroke="#334155" stroke-width="2"  fill="none"/><rect x="40" y="500" width="1100" height="100" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="535.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">GC9A01 (левый край сверху↓): VCC→5V, A2→BLK, A1→RES, A0→DC,</text><text x="590" y="554.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">D15→SCL, D14=NC, D16→SDA, D10→CS, GND→GND.</text><text x="590" y="573.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">SPI 8 MHz. BLK = digital HIGH (на A2 нет PWM у 32U4).</text><rect x="40" y="620" width="1100" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="647.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">PC817: сторона мотоцикла и сторона Arduino связаны только светом.</text><text x="590" y="666.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Для передач (прямые GPIO) общая GND — развязки нет.</text><rect x="40" y="705" width="1100" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="732.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">SPEED pin 9 — гипотеза. RPM_PULSES_PER_REV в rpm.h = 1.0 до калибровки.</text><text x="590" y="751.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Не подключать: CHMCU/MCP, MPU-6050.</text><rect x="40" y="790" width="1100" height="55" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="822.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Файлы: docs/wiring-enduro-v3.drawio • docs/wiring-blocks-dark.drawio • HARDWARE.md</text></svg>