<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="1200" height="1020" fill="#fff"/><rect x="20" y="15" width="1160" height="48" fill="#15334a" stroke="#ffffff"/><text x="600" y="47.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">01 / Обзор системы</text><rect x="25" y="70" width="1150" height="45" fill="#f1f5f9" stroke="#cbd5e1"/><text x="600" y="97.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Enduro-v2 • FW 1.5.1-gpio-gear • Без MCP • правый край = байк D0..D9 • левый = TFT</text><rect x="40" y="140" width="220" height="80" fill="#dbeafe" stroke="#334155"/><text x="150" y="165.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Janxin M178A</text><text x="150" y="185.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">штатная приборка</text><text x="150" y="205.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">разъём 18 pin</text><rect x="360" y="140" width="200" height="80" fill="#fef3c7" stroke="#334155"/><text x="460" y="165.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817</text><text x="460" y="185.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">оптрон</text><text x="460" y="205.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">(12 V → 5 V)</text><rect x="680" y="140" width="240" height="80" fill="#dcfce7" stroke="#334155"/><text x="800" y="165.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Pro Micro</text><text x="800" y="185.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">5 V / 16 MHz</text><text x="800" y="205.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">ATmega32U4</text><rect x="960" y="140" width="180" height="80" fill="#e0e7ff" stroke="#334155"/><text x="1050" y="175.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GC9A01</text><text x="1050" y="195.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">240×240 SPI</text><path d="M260 180 L360 180" stroke="#64748b" stroke-width="2"  fill="none"/><path d="M560 180 L680 180" stroke="#64748b" stroke-width="2"  fill="none"/><path d="M920 180 L960 180" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="40" y="280" width="1100" height="50" fill="#fff7ed" stroke="#334155"/><text x="590" y="310.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Питание стенд: USB → Pro Micro 5V/GND → экран. Борт +12 V (M178 pin 3) пока не используется.</text><rect x="40" y="360" width="280" height="45" fill="#f8fafc" stroke="#334155"/><text x="180" y="387.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Передачи 1..6 + N</text><rect x="360" y="360" width="780" height="45" fill="#ffffff" stroke="#334155"/><text x="750" y="387.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Жгут: D2..D7 = 1..6, D8 = N</text><rect x="40" y="415" width="280" height="45" fill="#f8fafc" stroke="#334155"/><text x="180" y="442.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Дальний (pin 4)</text><rect x="360" y="415" width="780" height="45" fill="#ffffff" stroke="#334155"/><text x="750" y="442.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817 → D9 (сразу после Gear 6)</text><rect x="40" y="470" width="280" height="45" fill="#f8fafc" stroke="#334155"/><text x="180" y="497.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">RPM / SPEED</text><rect x="360" y="470" width="780" height="45" fill="#ffffff" stroke="#334155"/><text x="750" y="497.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817 → D0 / D1 (верх правого ряда)</text><rect x="40" y="525" width="280" height="45" fill="#f8fafc" stroke="#334155"/><text x="180" y="552.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Дисплей</text><rect x="360" y="525" width="780" height="45" fill="#ffffff" stroke="#334155"/><text x="750" y="552.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Левый край: A0/A1/A2 + D15/D16/D10</text><rect x="40" y="600" width="1100" height="70" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="630.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">CHMCU-2317 / MCP23017 не используется. I2C свободен (можно позже).</text><text x="590" y="649.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Общая GND борт↔Arduino нужна для прямого чтения передач.</text><rect x="40" y="690" width="1100" height="70" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="720.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">+12 V (pin 3 зажигание, pin 4 дальний, лампы) — НИКОГДА напрямую на Pro Micro.</text><text x="590" y="739.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Только через PC817 или buck 12→5 (питание платы в будущем).</text><rect x="40" y="780" width="1100" height="70" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="810.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Свободно: A3, D14 (дырка в ленте дисплея).</text><text x="590" y="829.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Занято: D0..D9 байк, A0..A2 + D10/D15/D16 TFT.</text></svg>