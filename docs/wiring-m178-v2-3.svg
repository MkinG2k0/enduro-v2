<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="1200" height="1020" fill="#fff"/><rect x="20" y="15" width="1160" height="48" fill="#15334a" stroke="#ffffff"/><text x="600" y="47.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">03 / Питание и общая масса</text><rect x="25" y="70" width="1150" height="45" fill="#f1f5f9" stroke="#cbd5e1"/><text x="600" y="97.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">План питания от бортовой сети • Buck 12→5 V • Общая GND согласно новой архитектуре.</text><rect x="30" y="160" width="300" height="55" fill="#fee2e2" stroke="#334155"/><text x="180" y="182.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">M178 pin 3</text><text x="180" y="202.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">+12 V после зажигания</text><rect x="490" y="160" width="210" height="55" fill="#fef3c7" stroke="#334155"/><text x="595" y="182.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Buck</text><text x="595" y="202.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">IN+ → OUT+ 5 V</text><rect x="860" y="160" width="290" height="55" fill="#fee2e2" stroke="#334155"/><text x="1005" y="192.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Шина +5 V</text><path d="M330 188 L490 188" stroke="#dc2626" stroke-width="2"  fill="none"/><path d="M700 188 L860 188" stroke="#dc2626" stroke-width="2"  fill="none"/><rect x="30" y="265" width="300" height="55" fill="#e2e8f0" stroke="#334155"/><text x="180" y="297.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">M178 pin 1 / GND</text><rect x="490" y="265" width="210" height="55" fill="#e2e8f0" stroke="#334155"/><text x="595" y="297.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Buck IN− / OUT−</text><rect x="860" y="265" width="290" height="55" fill="#e2e8f0" stroke="#334155"/><text x="1005" y="297.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Общая GND</text><path d="M330 292 L490 292" stroke="#334155" stroke-width="2"  fill="none"/><path d="M700 292 L860 292" stroke="#334155" stroke-width="2"  fill="none"/><rect x="30" y="380" width="1120" height="45" fill="#dbeafe" stroke="#334155"/><text x="590" y="407.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Распределение питания • одинаковые имена шин означают электрическое соединение</text><rect x="30" y="445" width="210" height="50" fill="#ffffff" stroke="#334155"/><text x="135" y="475.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Pro Micro</text><rect x="250" y="445" width="450" height="50" fill="#fff1f2" stroke="#334155"/><text x="475" y="475.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">+5 V → VCC (не RAW)</text><rect x="710" y="445" width="440" height="50" fill="#f1f5f9" stroke="#334155"/><text x="930" y="475.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GND → GND</text><rect x="30" y="510" width="210" height="50" fill="#ffffff" stroke="#334155"/><text x="135" y="540.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">MCP23017</text><rect x="250" y="510" width="450" height="50" fill="#fff1f2" stroke="#334155"/><text x="475" y="540.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">+5 V → VCC; RESET через подтяжку</text><rect x="710" y="510" width="440" height="50" fill="#f1f5f9" stroke="#334155"/><text x="930" y="540.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GND → GND; адресные A0/A1/A2</text><rect x="30" y="575" width="210" height="50" fill="#ffffff" stroke="#334155"/><text x="135" y="605.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GC9A01</text><rect x="250" y="575" width="450" height="50" fill="#fff1f2" stroke="#334155"/><text x="475" y="605.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">+5 V → VCC только при совместимости</text><rect x="710" y="575" width="440" height="50" fill="#f1f5f9" stroke="#334155"/><text x="930" y="605.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GND → GND</text><rect x="30" y="640" width="210" height="50" fill="#ffffff" stroke="#334155"/><text x="135" y="670.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817 CH1–CH3</text><rect x="250" y="640" width="450" height="50" fill="#fff1f2" stroke="#334155"/><text x="475" y="670.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Питание / подтяжки — по схеме модуля</text><rect x="710" y="640" width="440" height="50" fill="#f1f5f9" stroke="#334155"/><text x="930" y="670.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Входные и выходные GND → общая GND</text><rect x="30" y="740" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="767.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Общая масса означает отсутствие полной гальванической развязки борта и контроллера.</text><text x="590" y="786.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">PC817 остаются в цепях согласования RPM, SPEED? и дальнего.</text><rect x="30" y="825" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="852.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Показаны межмодульные соединения. Защита питания от бортовых выбросов,</text><text x="590" y="871.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">полярность и параметры входных цепей PC817 требуют отдельной проработки.</text><rect x="30" y="910" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="937.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Схема фиксирует новую разводку; соответствие текущей прошивки ей не проверялось.</text><text x="590" y="956.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Цвета линий условные: красный — питание, серый — GND, зелёный — передачи/N, пунктир — SPEED?.</text></svg>