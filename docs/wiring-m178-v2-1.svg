<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="1200" height="1020" fill="#fff"/><rect x="20" y="15" width="1160" height="48" fill="#15334a" stroke="#ffffff"/><text x="600" y="47.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">01 / M178 → входы приборки</text><rect x="25" y="70" width="1150" height="45" fill="#f1f5f9" stroke="#cbd5e1"/><text x="600" y="97.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Актуальная раскладка • 29.09.2026 • Блоки показывают электрические связи, а не физическое расположение выводов.</text><rect x="30" y="135" width="250" height="45" fill="#dbeafe" stroke="#334155"/><text x="155" y="162.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">M178 • контакт / сигнал</text><rect x="790" y="135" width="360" height="45" fill="#dcfce7" stroke="#334155"/><text x="970" y="162.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">MCP23017 • GPIO справа на плате</text><rect x="30" y="195" width="250" height="36" fill="#ffffff" stroke="#334155"/><text x="155" y="218.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">10 / Gear 1</text><rect x="790" y="195" width="360" height="36" fill="#ffffff" stroke="#334155"/><text x="970" y="218.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">A2 / Gear 1</text><path d="M280 213 L790 213" stroke="#047857" stroke-width="2"  fill="none"/><rect x="30" y="243" width="250" height="36" fill="#ffffff" stroke="#334155"/><text x="155" y="266.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">11 / Gear 2</text><rect x="790" y="243" width="360" height="36" fill="#ffffff" stroke="#334155"/><text x="970" y="266.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">A3 / Gear 2</text><path d="M280 261 L790 261" stroke="#047857" stroke-width="2"  fill="none"/><rect x="30" y="291" width="250" height="36" fill="#ffffff" stroke="#334155"/><text x="155" y="314.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">12 / Gear 3</text><rect x="790" y="291" width="360" height="36" fill="#ffffff" stroke="#334155"/><text x="970" y="314.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">A4 / Gear 3</text><path d="M280 309 L790 309" stroke="#047857" stroke-width="2"  fill="none"/><rect x="30" y="339" width="250" height="36" fill="#ffffff" stroke="#334155"/><text x="155" y="362.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">13 / Gear 4</text><rect x="790" y="339" width="360" height="36" fill="#ffffff" stroke="#334155"/><text x="970" y="362.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">A5 / Gear 4</text><path d="M280 357 L790 357" stroke="#047857" stroke-width="2"  fill="none"/><rect x="30" y="387" width="250" height="36" fill="#ffffff" stroke="#334155"/><text x="155" y="410.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">14 / Gear 5</text><rect x="790" y="387" width="360" height="36" fill="#ffffff" stroke="#334155"/><text x="970" y="410.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">A6 / Gear 5</text><path d="M280 405 L790 405" stroke="#047857" stroke-width="2"  fill="none"/><rect x="30" y="435" width="250" height="36" fill="#ffffff" stroke="#334155"/><text x="155" y="458.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">15 / Gear 6</text><rect x="790" y="435" width="360" height="36" fill="#ffffff" stroke="#334155"/><text x="970" y="458.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">A7 / Gear 6</text><path d="M280 453 L790 453" stroke="#047857" stroke-width="2"  fill="none"/><rect x="30" y="493" width="250" height="36" fill="#ffffff" stroke="#334155"/><text x="155" y="516.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">2 / Neutral</text><rect x="790" y="493" width="360" height="36" fill="#ffffff" stroke="#334155"/><text x="970" y="516.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">B0 / Neutral</text><path d="M280 511 L790 511" stroke="#047857" stroke-width="2"  fill="none"/><rect x="30" y="560" width="250" height="40" fill="#ffffff" stroke="#334155"/><text x="155" y="585.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">4 / Дальний 12–14 V</text><rect x="440" y="560" width="210" height="40" fill="#fef3c7" stroke="#334155"/><text x="545" y="585.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817 • CH3</text><rect x="790" y="560" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="585.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">MCP B1 / High Beam</text><path d="M280 580 L440 580" stroke="#2563eb" stroke-width="2"  fill="none"/><path d="M650 580 L790 580" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="30" y="620" width="250" height="40" fill="#ffffff" stroke="#334155"/><text x="155" y="645.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">16 / RPM</text><rect x="440" y="620" width="210" height="40" fill="#fef3c7" stroke="#334155"/><text x="545" y="645.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817 • CH1</text><rect x="790" y="620" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="645.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Pro Micro D0 / RXI</text><path d="M280 640 L440 640" stroke="#9333ea" stroke-width="2"  fill="none"/><path d="M650 640 L790 640" stroke="#9333ea" stroke-width="2"  fill="none"/><rect x="30" y="680" width="250" height="40" fill="#ffffff" stroke="#334155"/><text x="155" y="705.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">9 / SPEED?</text><rect x="440" y="680" width="210" height="40" fill="#fef3c7" stroke="#334155"/><text x="545" y="705.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817 • CH2</text><rect x="790" y="680" width="360" height="40" fill="#ffffff" stroke="#334155"/><text x="970" y="705.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Pro Micro D1 / TXO</text><path d="M280 700 L440 700" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" fill="none"/><path d="M650 700 L790 700" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" fill="none"/><rect x="30" y="750" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="777.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Передачи и N: замыкание на GND; входы INPUT_PULLUP, LOW = активно.</text><text x="590" y="796.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Свободны GPIO A0/A1 и B2–B7. Pins 8, 17: UNKNOWN / NC; 5–7, 18: заглушки / NC.</text><rect x="30" y="835" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="862.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">SPEED pin 9 — только гипотеза: подтвердить импульсы при вращении колеса.</text><text x="590" y="881.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">PC817 показан как готовый согласующий канал; клеммы, резисторы и питание сверить с конкретным модулем.</text><rect x="30" y="920" width="1120" height="65" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="947.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">M178: ряды по контексту 10–18 / 1–9. Вид со стороны контактов или проводов НЕ подтверждён.</text><text x="590" y="966.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Перед пайкой сверить нумерацию по корпусу и измерениям; эта страница не является видом разъёма.</text></svg>