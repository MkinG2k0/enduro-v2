<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="1200" height="1020" fill="#fff"/><rect x="20" y="15" width="1160" height="48" fill="#15334a" stroke="#ffffff"/><text x="600" y="47.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">02 / M178 → передачи → правый край</text><rect x="25" y="70" width="1150" height="45" fill="#f1f5f9" stroke="#cbd5e1"/><text x="600" y="97.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Один шлейф D2..D9: Gear1..6, N, HB. Замыкание на массу. LOW = активно.</text><rect x="40" y="140" width="300" height="45" fill="#dbeafe" stroke="#334155"/><text x="190" y="167.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">M178 контакт / сигнал</text><rect x="820" y="140" width="320" height="45" fill="#dcfce7" stroke="#334155"/><text x="980" y="167.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Pro Micro GPIO</text><rect x="40" y="195" width="1100" height="36" fill="#bbf7d0" stroke="#334155"/><text x="590" y="218.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">Правый ряд платы — передачи подряд</text><rect x="40" y="245" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="190" y="270.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">10 / Gear 1</text><rect x="820" y="245" width="320" height="40" fill="#dcfce7" stroke="#334155"/><text x="980" y="270.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D2</text><path d="M340 265 L820 265" stroke="#047857" stroke-width="2"  fill="none"/><rect x="40" y="293" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="190" y="318.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">11 / Gear 2</text><rect x="820" y="293" width="320" height="40" fill="#dcfce7" stroke="#334155"/><text x="980" y="318.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D3</text><path d="M340 313 L820 313" stroke="#047857" stroke-width="2"  fill="none"/><rect x="40" y="341" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="190" y="366.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">12 / Gear 3</text><rect x="820" y="341" width="320" height="40" fill="#dcfce7" stroke="#334155"/><text x="980" y="366.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D4</text><path d="M340 361 L820 361" stroke="#047857" stroke-width="2"  fill="none"/><rect x="40" y="389" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="190" y="414.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">13 / Gear 4</text><rect x="820" y="389" width="320" height="40" fill="#dcfce7" stroke="#334155"/><text x="980" y="414.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D5</text><path d="M340 409 L820 409" stroke="#047857" stroke-width="2"  fill="none"/><rect x="40" y="437" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="190" y="462.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">14 / Gear 5</text><rect x="820" y="437" width="320" height="40" fill="#dcfce7" stroke="#334155"/><text x="980" y="462.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D6</text><path d="M340 457 L820 457" stroke="#047857" stroke-width="2"  fill="none"/><rect x="40" y="485" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="190" y="510.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">15 / Gear 6</text><rect x="820" y="485" width="320" height="40" fill="#dcfce7" stroke="#334155"/><text x="980" y="510.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D7</text><path d="M340 505 L820 505" stroke="#047857" stroke-width="2"  fill="none"/><rect x="40" y="533" width="300" height="40" fill="#ffffff" stroke="#334155"/><text x="190" y="558.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">2 / Neutral N</text><rect x="820" y="533" width="320" height="40" fill="#dcfce7" stroke="#334155"/><text x="980" y="558.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D8</text><path d="M340 553 L820 553" stroke="#047857" stroke-width="2"  fill="none"/><rect x="40" y="590" width="300" height="40" fill="#dbeafe" stroke="#334155"/><text x="190" y="615.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">4 / Дальний +12 V</text><rect x="400" y="590" width="280" height="40" fill="#fef3c7" stroke="#334155"/><text x="540" y="615.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">PC817 →</text><rect x="820" y="590" width="320" height="40" fill="#dbeafe" stroke="#334155"/><text x="980" y="615.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">D9 High Beam</text><path d="M340 610 L400 610" stroke="#2563eb" stroke-width="2"  fill="none"/><path d="M680 610 L820 610" stroke="#2563eb" stroke-width="2"  fill="none"/><rect x="40" y="650" width="300" height="45" fill="#e2e8f0" stroke="#334155"/><text x="190" y="677.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">1 / GND масса байка</text><rect x="820" y="650" width="320" height="45" fill="#e2e8f0" stroke="#334155"/><text x="980" y="677.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#172b3a">GND Pro Micro</text><path d="M340 672 L820 672" stroke="#334155" stroke-width="2"  fill="none"/><rect x="40" y="720" width="1100" height="55" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="742.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Общая земля обязательна. Только сухой контакт на GND — не +12 V.</text><text x="590" y="761.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">HB на D9 сразу после Gear 6 — один жгут D2..D9.</text><rect x="40" y="795" width="1100" height="55" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="817.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Прошивка: src/gear_inputs.h + high_beam.h — FW 1.5.1-gpio-gear.</text><text x="590" y="836.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">ERR на экране = 0 или &gt;1 линии в LOW.</text><rect x="40" y="870" width="1100" height="50" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="899.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172b3a">Выше по тому же краю: D0=RPM, D1=SPEED (через PC817).</text></svg>